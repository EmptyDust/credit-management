version: 2
updates:
  # 1. 监控 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    labels:
      - "ci/cd"

  # 2. 监控根目录 docker-compose.yml
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    labels:
      - "docker"

  # 3. 监控 v2 backend Dockerfile
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    labels:
      - "docker"
      - "backend"

  # 4. 监控 v2 backend Go Modules
  - package-ecosystem: "gomod"
    directory: "/backend"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    labels:
      - "backend"
      - "dependencies"

  # 5. 监控前端依赖
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    labels:
      - "frontend"
      - "dependencies"
